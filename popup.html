<!DOCTYPE html>
<html>
<head>
    <title>HubSpot Role Switcher</title>
    <style>
        body {
            width: 200px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        .role-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: none;
            border-radius: 4px;
            background-color: #ff7a59;
            color: white;
            cursor: pointer;
        }
        .role-btn:hover {
            background-color: #ff8f73;
        }
        h2 {
            color: #33475b;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h2>Select Role</h2>
    <button class="role-btn" id="sales">Sales</button>
    <button class="role-btn" id="marketing">Marketing</button>
    <button class="role-btn" id="development">Development</button>
    <script src="popup.js"></script>
</body>
</html>
